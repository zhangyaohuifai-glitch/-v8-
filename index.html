 
<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>西鐵小巴 v8.8.0 · 終極全線復活版</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
:root {
  --bg: #0f0f0f; --card: #1c1c1e; --gold: #ffcc00;
  --blue: #0a84ff; --red: #ff453a; --green: #30d158; --purple: #bf5af2;
  --orange: #ff9500; --radius: 18px; --vh: 1vh;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, 'Segoe UI', sans-serif; }
body { background: var(--bg); color: #fff; height: calc(var(--vh, 1vh) * 100); display: flex; flex-direction: column; overflow: hidden; user-select: none; -webkit-tap-highlight-color: transparent; }
.header { padding: 10px; text-align: center; border-bottom: 1px solid #333; flex-shrink: 0; position: relative; }
.title { font-size: 30px; font-weight: 800; color: var(--gold); }
.dev-tag { font-size: 16px; color: #aaa; display: inline-block; padding: 4px 18px; border-radius: 20px; cursor: pointer; }
.global-voice-toggle { position: absolute; top: 10px; right: 10px; width: 48px; height: 48px; border-radius: 50%; background: var(--green); border: none; color: #fff; font-size: 24px; cursor: pointer; z-index: 100; }
.view { display: none; flex: 1; overflow-y: auto; padding: 12px; flex-direction: column; }
.view.active { display: flex; }
.card { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; border: 1px solid #333; }
.btn { width: 100%; padding: 14px; border-radius: 16px; font-size: 22px; font-weight: 700; border: none; cursor: pointer; color: #fff; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.btn:active { opacity: 0.8; transform: scale(0.98); }
.btn-portal { background: linear-gradient(135deg, #0a84ff, #0066cc); }
.btn-secondary { background: #3a3a3c; }
.btn-green { background: var(--green); }
.btn-red { background: var(--red); }
.badge { display: inline-block; padding: 8px 18px; border-radius: 20px; font-weight: 700; font-size: 20px; margin: 4px; }
.badge-red { background: var(--red); } .badge-blue { background: var(--blue); } .badge-purple { background: var(--purple); }
.big-number { font-size: 64px; font-weight: 800; text-align: center; margin: 8px 0; line-height: 1.1; color: var(--gold); }
.station-name { font-size: 30px; font-weight: 700; text-align: center; margin: 6px 0; color: var(--gold); }
.msg-area { background: #1a1a1a; border-radius: 14px; padding: 12px; margin-top: 8px; }
.msg-list { max-height: 160px; overflow-y: auto; margin-bottom: 8px; font-size: 16px; }
.msg-row { display: flex; gap: 10px; align-items: center; justify-content: center; max-width: 500px; margin: 0 auto 8px auto; }
.msg-input { flex: 1; padding: 12px; border-radius: 12px; border: none; font-size: 18px; background: #2c2c2e; color: #fff; }
.record-btn, .send-btn { width: 48px; height: 48px; border-radius: 14px; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.record-btn { background: #ff9f0a; color: #000; font-size: 24px; }
.send-btn { background: var(--blue); color: #fff; font-size: 16px; font-weight: 700; }
.toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 12px 28px; border-radius: 30px; font-size: 18px; z-index: 999; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
.toast.show { opacity: 1; }
.admin-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
.admin-tab { flex: 1; padding: 10px; background: #2c2c2e; border: none; color: #888; border-radius: 12px; cursor: pointer; font-size: 16px; font-weight: 700; }
.admin-tab.active { background: var(--gold); color: #000; }
.admin-section { display: none; }
.admin-section.active { display: block; }
.admin-stat-card { background: #2c2c2e; border-radius: 12px; padding: 12px; text-align: center; margin-bottom: 10px; }
.admin-stat-card .value { font-size: 32px; font-weight: 800; color: var(--gold); }
.admin-vehicle-item { background: #2c2c2e; border-radius: 12px; padding: 12px; margin-bottom: 8px; border-left: 4px solid var(--blue); }
.play-audio { background: var(--blue); color: #fff; border: none; padding: 4px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; margin-right: 6px; }
</style>
</head>
<body>

<div class="header">
  <div class="title">西鐵小巴 v8.8.0</div>
  <div class="dev-tag">開發者：大輝</div>
  <button class="global-voice-toggle" id="global-voice-btn" title="全局語音開關">🔊</button>
</div>

<!-- 登入頁面 -->
<div id="auth-view" class="view active">
  <div class="card" style="max-width: 400px; margin: auto; margin-top: 20vh;">
    <h2 style="color: var(--gold); text-align: center; margin-bottom: 20px;">西鐵小巴</h2>
    <p style="text-align: center; color: #aaa; margin-bottom: 20px;">請使用 Google 帳戶登入</p>
    <button id="google-login-btn" class="btn btn-portal" style="background: #fff; color: #333; border: 1px solid #ddd;">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" style="width: 24px; height: 24px; margin-right: 10px;">
      使用 Google 帳戶登入
    </button>
    <p id="auth-error" style="color: var(--red); text-align: center; margin-top: 10px; display: none;"></p>
  </div>
</div>

<!-- 乘客頁面（原有功能簡化保留） -->
<div id="passenger-view" class="view">
  <div class="card">
    <div class="station-name">下一站：元朗站</div>
    <div class="big-number">3</div>
    <div style="text-align:center;">分鐘後到達</div>
  </div>
  <div class="msg-area">
    <div class="msg-list" id="msg-list"></div>
    <div class="msg-row">
      <input class="msg-input" id="msg-input" placeholder="輸入訊息...">
      <button class="send-btn" id="send-btn">送</button>
    </div>
  </div>
  <button class="btn btn-green" id="driver-btn" style="display:none;">司機模式</button>
  <button class="btn btn-red" id="admin-btn" style="display:none;">管理後台</button>
  <button class="btn btn-secondary" id="logout-btn">登出</button>
</div>

<!-- 管理員頁面 -->
<div id="admin-view" class="view">
  <div class="header" style="border-bottom: none;">
    <span class="title" style="font-size: 24px;">管理後台</span>
    <button class="btn btn-secondary" id="admin-back" style="width:auto; padding:8px 16px; font-size:16px;">返回</button>
  </div>
  <div class="admin-tabs">
    <button class="admin-tab active" data-tab="users">用戶</button>
    <button class="admin-tab" data-tab="announce">公告</button>
    <button class="admin-tab" data-tab="logs">日誌</button>
  </div>
  <div id="admin-users" class="admin-section active"></div>
  <div id="admin-announce" class="admin-section"></div>
  <div id="admin-logs" class="admin-section"></div>
</div>

<script>
// ===== Firebase 初始化 =====
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT",
  appId: "YOUR_APP_ID"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const database = firebase.database();

let currentUser = { uid: null, role: null, isAdmin: false };

// ===== Google 登入 =====
const googleProvider = new firebase.auth.GoogleAuthProvider();
document.getElementById('google-login-btn').addEventListener('click', () => {
  auth.signInWithPopup(googleProvider).then(async (result) => {
    const user = result.user;
    const isNew = result.additionalUserInfo.isNewUser;
    if (isNew) {
      await database.ref('users/' + user.uid).set({
        email: user.email, displayName: user.displayName,
        role: 'passenger', createdAt: Date.now(), status: 'active'
      });
    }
    document.getElementById('auth-error').style.display = 'none';
  }).catch((error) => {
    let msg = '登入失敗';
    if (error.code === 'auth/popup-blocked') msg = '彈出視窗被阻擋';
    else if (error.code === 'auth/popup-closed-by-user') msg = '你關閉了登入視窗';
    document.getElementById('auth-error').textContent = msg;
    document.getElementById('auth-error').style.display = 'block';
  });
});

// ===== 狀態監聽 =====
auth.onAuthStateChanged(async (user) => {
  const authView = document.getElementById('auth-view');
  if (user) {
    currentUser.uid = user.uid;
    const snap = await database.ref('users/' + user.uid).once('value');
    let data = snap.val();
    if (!data) {
      await database.ref('users/' + user.uid).set({ email: user.email, role: 'passenger', createdAt: Date.now(), status: 'active' });
      data = { role: 'passenger' };
    }
    currentUser.role = data.role || 'passenger';
    const adminSnap = await database.ref('admins/' + user.uid).once('value');
    currentUser.isAdmin = adminSnap.exists();

    authView.classList.remove('active');
    document.getElementById('passenger-view').classList.add('active');
    document.getElementById('driver-btn').style.display = currentUser.role === 'driver' ? 'block' : 'none';
    document.getElementById('admin-btn').style.display = currentUser.isAdmin ? 'block' : 'none';
  } else {
    currentUser = { uid: null, role: null, isAdmin: false };
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    authView.classList.add('active');
  }
});

// ===== 登出 =====
document.getElementById('logout-btn').addEventListener('click', () => auth.signOut());

// ===== 管理員切換 =====
document.getElementById('admin-btn').addEventListener('click', () => {
  document.getElementById('passenger-view').classList.remove('active');
  document.getElementById('admin-view').classList.add('active');
  loadUsers();
});
document.getElementById('admin-back').addEventListener('click', () => {
  document.getElementById('admin-view').classList.remove('active');
  document.getElementById('passenger-view').classList.add('active');
});

// ===== Tab 切換 =====
document.querySelectorAll('.admin-tab').forEach(tab => {
  tab.addEventListener('click', function() {
    document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('active'));
    this.classList.add('active');
    document.getElementById('admin-' + this.dataset.tab).classList.add('active');
    if (this.dataset.tab === 'users') loadUsers();
    if (this.dataset.tab === 'announce') loadAnnounce();
    if (this.dataset.tab === 'logs') loadLogs();
  });
});

// ===== 用戶管理 =====
async function loadUsers() {
  const c = document.getElementById('admin-users');
  c.innerHTML = '載入中...';
  const snap = await database.ref('users').once('value');
  const users = snap.val() || {};
  let html = `<div class="admin-stat-card">總用戶：<span class="value">${Object.keys(users).length}</span></div>`;
  for (const uid in users) {
    const u = users[uid];
    html += `<div class="admin-vehicle-item">
      <div><strong>${u.email || '無'}</strong> | 角色：${u.role} | 狀態：${u.status || 'active'}</div>
      <button class="play-audio" onclick="setRole('${uid}','${u.role === 'driver' ? 'passenger' : 'driver'}')">轉角色</button>
      <button class="play-audio" onclick="setAdmin('${uid}')">設管理</button>
    </div>`;
  }
  c.innerHTML = html;
}
window.setRole = (uid, role) => database.ref('users/' + uid + '/role').set(role).then(loadUsers);
window.setAdmin = (uid) => database.ref('admins/' + uid).set(true).then(loadUsers);

// ===== 公告 =====
function loadAnnounce() {
  const c = document.getElementById('admin-announce');
  c.innerHTML = `<textarea id="ann-text" style="width:100%;height:80px;"></textarea>
    <button class="btn btn-green" onclick="pubAnn()">發布</button><div id="ann-list"></div>`;
  refreshAnn();
}
async function refreshAnn() {
  const snap = await database.ref('announcements').once('value');
  let h = '';
  snap.forEach(a => h += `<div class="admin-vehicle-item">${a.val().text}</div>`);
  document.getElementById('ann-list').innerHTML = h;
}
window.pubAnn = () => {
  const t = document.getElementById('ann-text').value;
  if (t) database.ref('announcements').push({ text: t, timestamp: Date.now() }).then(refreshAnn);
};

// ===== 日誌 =====
async function loadLogs() {
  const c = document.getElementById('admin-logs');
  const snap = await database.ref('logs/adminOperations').once('value');
  let h = '';
  snap.forEach(l => h += `<div class="admin-vehicle-item">${l.val().action} - ${new Date(l.val().timestamp).toLocaleString()}</div>`);
  c.innerHTML = h || '暫無';
}

// ===== 原有訊息功能（保留） =====
document.getElementById('send-btn').addEventListener('click', () => {
  const text = document.getElementById('msg-input').value.trim();
  if (text && currentUser.uid) {
    database.ref('messages').push({ senderUid: currentUser.uid, text: text, timestamp: Date.now() });
    document.getElementById('msg-input').value = '';
  }
});
database.ref('messages').on('child_added', (snap) => {
  const m = snap.val();
  const div = document.createElement('div');
  div.className = 'msg-row';
  div.textContent = m.text;  // 用 textContent 防 XSS
  document.getElementById('msg-list').appendChild(div);
});
</script>
</body>
</html>
