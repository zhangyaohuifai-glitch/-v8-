<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover" />
    <title>西鐵小巴 v10.0 · 智慧出行</title>
    <!-- Firebase SDK (僅 Database) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js">
    </script>
    <style>
        /* ===== CSS Variables & Reset (與之前相同，為節省篇幅此處省略，請複製時保留完整樣式) ===== */
        /* 您可複製上一版完整 CSS，此處為簡化範例，實際使用請確保樣式完整 */
        :root {
            --bg: #0b0b0e;
            --card: #18181c;
            --card2: #22222a;
            --gold: #f5c842;
            --blue: #0a84ff;
            --red: #ff453a;
            --green: #30d158;
            --purple: #bf5af2;
            --orange: #ff9500;
            --radius: 20px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            --text: #f0f0f0;
            --text2: #aaa;
            --font: -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            flex-direction: column;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--gold);
            border-radius: 8px;
        }

        /* ===== Header ===== */
        .header {
            padding: 12px 16px;
            text-align: center;
            border-bottom: 2px solid #2a2a32;
            flex-shrink: 0;
            position: relative;
            background: var(--bg);
            z-index: 5;
        }
        .title {
            font-size: 32px;
            font-weight: 900;
            color: var(--gold);
            letter-spacing: 1px;
        }
        .title small {
            font-size: 14px;
            font-weight: 400;
            color: var(--text2);
            margin-left: 6px;
        }
        .dev-tag {
            font-size: 14px;
            color: var(--text2);
            cursor: pointer;
            padding: 4px 14px;
            border-radius: 30px;
            background: #2a2a32;
            display: inline-block;
            margin-top: 4px;
            transition: 0.2s;
        }
        .dev-tag:active {
            transform: scale(0.95);
        }
        .header-actions {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            gap: 8px;
        }
        .header-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: #2a2a32;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            position: relative;
        }
        .header-btn:active {
            transform: scale(0.92);
        }
        .header-btn.has-notif {
            background: var(--gold);
            color: #000;
        }
        .header-btn .badge-dot {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 12px;
            height: 12px;
            background: var(--red);
            border-radius: 50%;
            border: 2px solid var(--bg);
        }

        /* ===== Views ===== */
        .view {
            display: none;
            flex: 1;
            overflow-y: auto;
            padding: 14px 16px 100px;
            flex-direction: column;
            background: var(--bg);
        }
        .view.active {
            display: flex;
        }

        /* ===== Cards ===== */
        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 16px 18px;
            margin-bottom: 14px;
            border: 1px solid #2a2a32;
            box-shadow: var(--shadow);
            transition: 0.2s;
        }
        .card-glass {
            background: rgba(24, 24, 28, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        /* ===== Buttons ===== */
        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            font-size: 22px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            color: #fff;
            margin-bottom: 12px;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #2a2a32;
        }
        .btn:active {
            transform: scale(0.97);
            opacity: 0.85;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--blue), #0055cc);
        }
        .btn-danger {
            background: linear-gradient(135deg, var(--red), #b91c1c);
        }
        .btn-success {
            background: linear-gradient(135deg, var(--green), #0f9d58);
        }
        .btn-warning {
            background: var(--orange);
            color: #000;
        }
        .btn-gold {
            background: var(--gold);
            color: #000;
        }
        .btn-secondary {
            background: #2a2a32;
            color: #ddd;
        }
        .btn-sm {
            font-size: 18px;
            padding: 12px;
        }
        .btn-row {
            display: flex;
            gap: 10px;
        }
        .btn-row .btn {
            flex: 1;
            margin-bottom: 0;
        }
        .btn-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            flex-shrink: 0;
            font-size: 26px;
            padding: 0;
        }

        /* ===== Badges ===== */
        .badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 700;
            margin: 3px 4px;
        }
        .badge-red {
            background: var(--red);
        }
        .badge-blue {
            background: var(--blue);
        }
        .badge-purple {
            background: var(--purple);
        }
        .badge-green {
            background: var(--green);
            color: #000;
        }
        .badge-gold {
            background: var(--gold);
            color: #000;
        }

        /* ===== Typography ===== */
        .big-number {
            font-size: 72px;
            font-weight: 900;
            text-align: center;
            color: var(--gold);
            line-height: 1;
            margin: 4px 0;
        }
        .station-name {
            font-size: 32px;
            font-weight: 700;
            text-align: center;
            color: var(--gold);
            margin: 4px 0;
        }
        .target-station {
            font-size: 18px;
            color: var(--text2);
            text-align: center;
        }
        .text-muted {
            color: var(--text2);
            font-size: 16px;
        }
        .text-center {
            text-align: center;
        }
        .mt-8 {
            margin-top: 8px;
        }
        .mb-8 {
            margin-bottom: 8px;
        }
        .flex {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .gap-6 {
            gap: 6px;
        }

        /* ===== Route Strip ===== */
        .route-strip {
            display: flex;
            overflow-x: auto;
            gap: 14px;
            padding: 10px 4px 14px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .route-strip::-webkit-scrollbar {
            height: 3px;
        }
        .route-strip::-webkit-scrollbar-thumb {
            background: var(--gold);
            border-radius: 8px;
        }
        .dot-node {
            flex: 0 0 90px;
            text-align: center;
            font-size: 13px;
            color: var(--text2);
            transition: 0.25s;
        }
        .dot {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #333;
            margin: 0 auto 6px;
            border: 3px solid #444;
            transition: 0.3s;
        }
        .dot-node.passed .dot {
            background: #555;
            border-color: #777;
        }
        .dot-node.current .dot {
            background: var(--green);
            box-shadow: 0 0 20px var(--green);
            border-color: #fff;
        }
        .dot-node.current span {
            color: #fff;
            font-weight: 800;
        }
        .dot-node.next .dot {
            background: var(--green);
            animation: blink 1s infinite;
            border-color: #fff;
        }
        .dot-node.next span {
            color: var(--green);
            font-weight: 700;
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        /* ===== Message Area ===== */
        .msg-area {
            background: #121216;
            border-radius: 16px;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #2a2a32;
        }
        .msg-list {
            max-height: 180px;
            overflow-y: auto;
            margin-bottom: 10px;
            font-size: 16px;
            line-height: 1.5;
        }
        .msg-item {
            padding: 6px 0;
            border-bottom: 1px solid #1e1e24;
            display: flex;
            gap: 8px;
            align-items: flex-start;
        }
        .msg-item .sender {
            font-weight: 700;
            color: var(--gold);
            flex-shrink: 0;
        }
        .msg-item .time {
            font-size: 12px;
            color: #666;
            flex-shrink: 0;
            margin-left: auto;
        }
        .msg-item .text {
            word-break: break-word;
        }
        .msg-row {
            display: flex;
            gap: 10px;
            align-items: center;
            max-width: 500px;
            margin: 0 auto;
        }
        .msg-input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px solid #333;
            font-size: 18px;
            background: #1e1e24;
            color: #fff;
            outline: none;
        }
        .msg-input:focus {
            border-color: var(--gold);
        }
        .record-btn {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            border: none;
            background: var(--orange);
            color: #000;
            font-size: 24px;
            cursor: pointer;
            flex-shrink: 0;
            transition: 0.2s;
            position: relative;
        }
        .record-btn.recording {
            background: var(--red);
            color: #fff;
            animation: pulse 0.5s infinite;
        }
        .record-btn .timer-badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background: var(--red);
            color: #fff;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 20px;
            display: none;
        }
        .record-btn.recording .timer-badge {
            display: block;
        }
        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.08);
            }
        }
        .send-btn {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            border: none;
            background: var(--blue);
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            flex-shrink: 0;
        }
        .audio-player {
            background: var(--card2);
            border-radius: 10px;
            padding: 4px 12px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin: 2px 0;
        }
        .audio-player button {
            background: var(--green);
            color: #000;
            border: none;
            padding: 2px 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        /* ===== Driver Panel ===== */
        .driver-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-bottom: 10px;
        }

        /* ===== Admin ===== */
        .admin-panel {
            background: #140a24;
            border: 2px solid var(--gold);
        }
        .admin-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .admin-tab {
            flex: 1;
            min-width: 60px;
            padding: 10px 8px;
            background: #2a2a32;
            border: none;
            color: #888;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        .admin-tab.active {
            background: var(--gold);
            color: #000;
        }
        .admin-section {
            display: none;
        }
        .admin-section.active {
            display: block;
        }
        .admin-input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #333;
            font-size: 18px;
            background: #1e1e24;
            color: #fff;
            margin-bottom: 8px;
            outline: none;
        }
        .admin-input:focus {
            border-color: var(--gold);
        }
        .admin-item {
            background: #1a1a22;
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 8px;
            border-left: 4px solid var(--blue);
        }
        .admin-item .label {
            font-weight: 700;
            color: var(--gold);
        }
        .admin-item .sub {
            color: var(--text2);
            font-size: 14px;
            margin-top: 2px;
        }
        .admin-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }
        .admin-stat {
            background: #1a1a22;
            border-radius: 14px;
            padding: 14px;
            text-align: center;
        }
        .admin-stat .num {
            font-size: 34px;
            font-weight: 900;
            color: var(--gold);
        }
        .admin-stat .lbl {
            font-size: 13px;
            color: #888;
        }

        /* ===== Overlays ===== */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 30;
            display: none;
            flex-direction: column;
            padding: 20px;
        }
        .overlay.show {
            display: flex;
        }
        .overlay-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-shrink: 0;
        }
        .overlay-header h2 {
            font-size: 24px;
        }
        .overlay-body {
            flex: 1;
            overflow-y: auto;
        }

        /* ===== Announce ===== */
        .announce-item {
            background: #1a1a22;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 10px;
            border-left: 4px solid var(--gold);
        }
        .announce-item .time {
            font-size: 12px;
            color: #666;
        }
        .announce-item .text {
            font-size: 17px;
            margin-top: 4px;
        }

        /* ===== QR ===== */
        #qr-box canvas {
            display: block;
            margin: 0 auto;
            border-radius: 12px;
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: #2a2a32;
            color: #fff;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 17px;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            max-width: 90%;
            text-align: center;
        }
        .toast.show {
            opacity: 1;
        }

        /* ===== Login Modal ===== */
        .login-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-modal.show {
            display: flex;
        }
        .login-card {
            background: var(--card);
            border: 2px solid var(--gold);
            border-radius: var(--radius);
            padding: 28px 24px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .login-card h2 {
            color: var(--gold);
            margin-bottom: 16px;
        }
        .login-card input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid #333;
            font-size: 20px;
            background: #1e1e24;
            color: #fff;
            margin: 6px 0;
            outline: none;
        }
        .login-card input:focus {
            border-color: var(--gold);
        }
        .login-card .btn {
            margin-top: 8px;
        }
        .login-card .error {
            color: var(--red);
            font-size: 16px;
            margin-top: 8px;
            min-height: 24px;
        }

        /* ===== Responsive ===== */
        @media (max-width: 480px) {
            .title {
                font-size: 24px;
            }
            .btn {
                font-size: 18px;
                padding: 14px;
            }
            .big-number {
                font-size: 54px;
            }
            .station-name {
                font-size: 26px;
            }
            .dot-node {
                flex: 0 0 70px;
                font-size: 11px;
            }
            .dot {
                width: 24px;
                height: 24px;
            }
            .header-actions {
                right: 8px;
            }
            .header-btn {
                width: 36px;
                height: 36px;
                font-size: 16px;
            }
        }

        /* ===== Scroll Snap for Driver Old ===== */
        .driver-scroll-container {
            height: 100%;
