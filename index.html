<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>西鐵小巴 v9.0</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,sans-serif; }
body { background:#0f0f0f; color:#fff; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
.header { padding:12px; text-align:center; border-bottom:1px solid #333; flex-shrink:0; }
.title { font-size:28px; font-weight:800; color:#ffcc00; }
.card { background:#1c1c1e; border-radius:18px; padding:20px; margin:12px; border:1px solid #333; }
.btn { width:100%; padding:16px; border-radius:16px; font-size:20px; font-weight:700; border:none; cursor:pointer; color:#fff; margin-bottom:10px; }
.btn-portal { background:linear-gradient(135deg,#0a84ff,#0066cc); }
.btn-warn { background:#ff9f0a; color:#000; }
.btn-secondary { background:#3a3a3c; }
.btn-green { background:#30d158; }
.btn-red { background:#ff453a; }
input { width:100%; padding:14px; border-radius:12px; border:none; font-size:18px; background:#2c2c2e; color:#fff; margin-bottom:10px; }
.toast { position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:12px 28px; border-radius:30px; z-index:999; opacity:0; transition:opacity 0.3s; pointer-events:none; }
.toast.show { opacity:1; }
.view { display:none; flex:1; overflow-y:auto; padding:12px; flex-direction:column; }
.view.active { display:flex; }
.login-modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:50; display:none; flex-direction:column; align-items:center; justify-content:center; padding:20px; }
.login-modal.active { display:flex; }
.login-card { background:#1c1c1e; border:2px solid #ffcc00; border-radius:20px; padding:24px; max-width:400px; width:100%; text-align:center; }
.error-msg { color:#ff453a; margin-top:8px; font-size:16px; }
.log-entry { background:#1a1a1a; padding:8px 12px; border-radius:8px; margin-bottom:4px; font-size:14px; color:#ddd; }
</style>
</head>
<body>

<div class="header">
  <div class="title">西鐵小巴 v9.0</div>
  <div style="font-size:14px; color:#aaa;">開發者：大輝</div>
</div>

<!-- 登入彈窗 -->
<div class="login-modal" id="login-modal">
  <div class="login-card">
    <h2 style="color:#ffcc00; margin-bottom:16px;">🔐 登入</h2>
    <div id="login-choice">
      <button class="btn btn-portal" id="login-as-admin">👑 管理員</button>
      <button class="btn btn-green" id="login-as-user">🧍 乘客/司機</button>
    </div>
    <div id="admin-login-form" style="display:none;">
      <input type="text" id="admin-username" placeholder="管理員名稱">
      <input type="password" id="admin-password" placeholder="密碼">
      <button class="btn btn-warn" id="admin-login-btn">確認</button>
      <button class="btn btn-secondary" id="admin-login-back">返回</button>
      <div id="admin-login-error" class="error-msg"></div>
    </div>
    <div id="user-login-form" style="display:none;">
      <input type="tel" id="user-phone" placeholder="電話號碼 (8位數字)">
      <button class="btn btn-green" id="user-login-btn">確認</button>
      <button class="btn btn-secondary" id="user-login-back">返回</button>
      <div id="user-login-error" class="error-msg"></div>
    </div>
    <button class="btn btn-secondary" id="login-cancel">取消</button>
  </div>
</div>

<!-- 大堂 -->
<div id="view-lobby" class="view active">
  <div class="card">
    <h3 style="color:#ffcc00;">📋 使用說明</h3>
    <p style="color:#ccc; line-height:1.8; margin-top:8px;">
      🚏 司機：登入 → 開始當值<br>
      🧍 乘客：登入 → 追蹤車輛<br>
      👑 管理員：登入 → 總管後台
    </p>
  </div>
  <button class="btn btn-portal" id="btn-passenger">🧍 乘客入口</button>
  <button class="btn btn-warn" id="btn-driver">🚏 司機入口</button>
  <button class="btn btn-secondary" id="btn-admin-panel" style="display:none;">👑 總管後台</button>
  <button class="btn btn-secondary" id="btn-logout">🚪 登出</button>
</div>

<!-- 乘客列表 -->
<div id="view-passenger-list" class="view">
  <h2 style="text-align:center;">🚐 線上小巴</h2>
  <div id="bus-list-container" style="margin:12px 0;">載入中…</div>
  <button class="btn btn-secondary" id="btn-back-list">返回大堂</button>
</div>

<!-- 乘客追蹤 -->
<div id="view-passenger" class="view">
  <div class="card" id="pass-data-card">請選擇車輛</div>
  <button class="btn btn-secondary" id="btn-back-track">返回列表</button>
</div>

<!-- 司機版面 -->
<div id="view-driver" class="view">
  <div class="card">
    <div id="d-info" style="font-size:18px; color:#aaa;">未登入</div>
    <div class="station-name" id="d-station" style="font-size:30px; font-weight:700; color:#ffcc00; margin:8px 0;">大棠黃泥墩</div>
    <div id="d-target" style="font-size:18px; color:#ffcc00;">下一站：大棠山路</div>
    <div style="font-size:48px; font-weight:800; color:#ffcc00; margin:8px 0;" id="d-pass-count">0</div>
    <div class="row" style="display:flex; gap:12px;">
      <button class="btn btn-green" id="btn-add-pass" style="flex:1;">＋ 乘客</button>
      <button class="btn btn-red" id="btn-sub-pass" style="flex:1;">－ 乘客</button>
    </div>
    <button class="btn btn-portal" id="btn-prev">◀ 上一站</button>
    <button class="btn btn-portal" id="btn-next">下一站 ▶</button>
    <button class="btn btn-green" id="start-gps">🟢 開始當值</button>
    <button class="btn btn-red" id="stop-gps" style="display:none;">🔴 停止當值</button>
    <button class="btn btn-secondary" id="btn-driver-back">返回大堂</button>
  </div>
</div>

<!-- 管理後台 -->
<div id="view-admin" class="view">
  <div class="card" style="border:2px solid #ffcc00; background:#1a0a2e;">
    <h2 style="color:#ffcc00;">🛡️ 總管後台</h2>
    <div id="admin-status" style="color:#aaa; margin:8px 0;">載入中...</div>
    <div id="admin-vehicle-list"></div>
    <button class="btn btn-secondary" id="btn-back-admin">返回大堂</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
// ============================================================
//  FIREBASE 設定（你嘅新 Config）
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyCnToMYsM7pIGeGHLt5xFbQfT5RAIWzTQA",
  authDomain: "van-v9-41439.firebaseapp.com",
  databaseURL: "https://van-v9-41439-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "van-v9-41439",
  storageBucket: "van-v9-41439.firebasestorage.app",
  messagingSenderId: "434506286219",
  appId: "1:434506286219:web:00a57d319da5c6cc4fc08e"
};

// 初始化 Firebase
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

// ============================================================
//  全域變數
// ============================================================
let currentUser = { uid: null, phone: null, isAdmin: false };
let driverData = {
  stationIndex: 0,
  passengerCount: 0,
  isActive: false,
  plate: null
};
let busListRef = null;

// ============================================================
//  站點資料
// ============================================================
const BUSY = ["大棠黃泥墩","大棠山路","大棠村迴旋處","水蕉新村","曉門","南坑排","南坑村","紅棗田","崇正公立學校","深涌村","禮修村公廁","蝶翠峰","富達廣場","合益路","鳳翔路","元朗站H出口（朗明街）"];
const NORMAL = ["大棠黃泥墩","大棠山路","大棠村迴旋處","水蕉新村","曉門","南坑排","南坑村","紅棗田","崇正公立學校","深涌村","禮修村公廁","蝶翠峰","富達廣場","教育路麥當勞","鄉議局中學","大球場","元朗廣場","余仁生（大馬路）","家居站","元朗站H出口（朗明街）","鳳翔路","合益路","富達廣場(回程)","蝶翠峰(回程)","禮修村公廁(回程)","深涌村(回程)","崇正公立學校(回程)","紅棗田(回程)","南坑村(回程)","南坑排(回程)","曉門(回程)","水蕉新村(回程)","大棠村迴旋處(回程)","大棠山路(回程)","大棠黃泥墩(終點站)"];

function getRoute() { return 'busy'; } // 簡化版只用繁忙路線

// ============================================================
//  工具函數
// ============================================================
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2500);
}

function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function encodeBase64(str) { return btoa(str); }
function decodeBase64(str) { return atob(str); }

// ============================================================
//  登入系統
// ============================================================
function openLoginModal() {
  document.getElementById('login-modal').classList.add('active');
  document.getElementById('login-choice').style.display = 'block';
  document.getElementById('admin-login-form').style.display = 'none';
  document.getElementById('user-login-form').style.display = 'none';
  document.getElementById('admin-login-error').textContent = '';
  document.getElementById('user-login-error').textContent = '';
}

// 取消登入
document.getElementById('login-cancel').addEventListener('click', () => {
  document.getElementById('login-modal').classList.remove('active');
});

// 選擇管理員登入
document.getElementById('login-as-admin').addEventListener('click', () => {
  document.getElementById('login-choice').style.display = 'none';
  document.getElementById('admin-login-form').style.display = 'block';
});

// 選擇一般用家登入
document.getElementById('login-as-user').addEventListener('click', () => {
  document.getElementById('login-choice').style.display = 'none';
  document.getElementById('user-login-form').style.display = 'block';
});

// 返回
document.getElementById('admin-login-back').addEventListener('click', () => {
  document.getElementById('admin-login-form').style.display = 'none';
  document.getElementById('login-choice').style.display = 'block';
});
document.getElementById('user-login-back').addEventListener('click', () => {
  document.getElementById('user-login-form').style.display = 'none';
  document.getElementById('login-choice').style.display = 'block';
});

// ===== 管理員登入（重點修復） =====
document.getElementById('admin-login-btn').addEventListener('click', async function() {
  const username = document.getElementById('admin-username').value.trim();
  const password = document.getElementById('admin-password').value.trim();
  const errEl = document.getElementById('admin-login-error');

  console.log('🔍 管理員登入嘗試:', username);

  if (!username || !password) {
    errEl.textContent = '請填寫用戶名及密碼';
    return;
  }

  try {
    // 先做匿名登入（Firebase 底層認證）
    console.log('🔄 正在進行匿名登入...');
    await auth.signInAnonymously();
    console.log('✅ 匿名登入成功');

    // 讀取管理員資料
    console.log('📖 讀取管理員資料:', 'admins/' + username);
    const snap = await db.ref('admins/' + username).once('value');
    const data = snap.val();
    console.log('📦 讀取結果:', data);

    if (!data) {
      errEl.textContent = '❌ 管理員帳戶不存在，請檢查 Database 是否有 admins/' + username;
      console.error('❌ 管理員不存在');
      return;
    }

    // 比對密碼（Base64 解碼）
    const storedPassword = data.password || '';
    const decodedPassword = decodeBase64(storedPassword);
    console.log('🔑 儲存密碼(Base64):', storedPassword);
    console.log('🔑 解碼後:', decodedPassword);
    console.log('🔑 輸入密碼:', password);

    if (decodedPassword === password) {
      // 成功！
      currentUser.isAdmin = true;
      currentUser.phone = username;
      document.getElementById('login-modal').classList.remove('active');
      document.getElementById('btn-admin-panel').style.display = 'block';
      showToast('✅ 管理員登入成功');
      console.log('🎉 管理員登入成功！');
      loadAdminPanel();
    } else {
      errEl.textContent = '❌ 密碼錯誤';
      console.error('❌ 密碼比對失敗');
    }
  } catch (error) {
    console.error('🔥 登入錯誤:', error);
    errEl.textContent = '❌ 錯誤：' + error.message;
    if (error.code === 'auth/operation-not-allowed') {
      errEl.textContent = '❌ 請去 Firebase Console → Authentication → 啟用「匿名登入」';
    }
  }
});

// ===== 一般用家登入 =====
document.getElementById('user-login-btn').addEventListener('click', async () => {
  const phone = document.getElementById('user-phone').value.trim();
  const errEl = document.getElementById('user-login-error');

  if (!phone || !/^\d{8,}$/.test(phone)) {
    errEl.textContent = '請輸入有效電話 (8位或以上數字)';
    return;
  }

  try {
    const cred = await auth.signInAnonymously();
    const uid = cred.user.uid;
    await db.ref('users/' + uid).set({ phone: phone, role: 'passenger' });
    currentUser.uid = uid;
    currentUser.phone = phone;
    currentUser.isAdmin = false;
    document.getElementById('login-modal').classList.remove('active');
    showToast('登入成功，電話：' + phone);
    document.getElementById('btn-admin-panel').style.display = 'none';
    showView('view-lobby');
  } catch (e) {
    errEl.textContent = '登入失敗：' + e.message;
  }
});

// ===== 檢查登入狀態 =====
auth.onAuthStateChanged(async (user) => {
  console.log('👤 Auth State Changed:', user);
  if (user && user.isAnonymous) {
    const snap = await db.ref('users/' + user.uid).once('value');
    const data = snap.val();
    if (data) {
      currentUser.uid = user.uid;
      currentUser.phone = data.phone || '';
      // 檢查是否管理員
      const adminSnap = await db.ref('admins').once('value');
      let isAdmin = false;
      adminSnap.forEach(child => {
        if (child.key === currentUser.phone) isAdmin = true;
      });
      currentUser.isAdmin = isAdmin;
      if (isAdmin) document.getElementById('btn-admin-panel').style.display = 'block';
      console.log('👤 當前用戶:', currentUser);
    }
  }
});

// ============================================================
//  大堂功能
// ============================================================
document.getElementById('btn-passenger').addEventListener('click', () => {
  if (!currentUser.uid) { openLoginModal(); return; }
  showView('view-passenger-list');
  loadBusList();
});

document.getElementById('btn-driver').addEventListener('click', () => {
  if (!currentUser.uid) { openLoginModal(); return; }
  showView('view-driver');
  initDriverPanel();
});

document.getElementById('btn-admin-panel').addEventListener('click', () => {
  if (!currentUser.isAdmin) { showToast('權限不足'); return; }
  showView('view-admin');
  loadAdminPanel();
});

document.getElementById('btn-logout').addEventListener('click', () => {
  auth.signOut().then(() => {
    currentUser = { uid: null, phone: null, isAdmin: false };
    document.getElementById('btn-admin-panel').style.display = 'none';
    showToast('已登出');
    showView('view-lobby');
  });
});

// ============================================================
//  乘客功能（簡化）
// ============================================================
function loadBusList() {
  const container = document.getElementById('bus-list-container');
  container.innerHTML = '載入中…';
  if (busListRef) busListRef.off();
  busListRef = db.ref('van/active_buses');
  busListRef.on('value', snap => {
    const data = snap.val() || {};
    let html = '';
    let count = 0;
    for (const plate in data) {
      const bus = data[plate];
      if (Date.now() - bus.lastUpdate > 60000) continue;
      count++;
      html += `<div class="card">
        <div style="font-size:24px; font-weight:bold; color:#ffcc00;">🚐 ${plate}</div>
        <div>${bus.currentStation || '未知'} · 👥 ${bus.passengerCount || 0}人</div>
        <button class="btn btn-portal" data-plate="${plate}">追蹤</button>
      </div>`;
    }
    container.innerHTML = count === 0 ? '目前沒有活躍車輛' : html;
    container.querySelectorAll('[data-plate]').forEach(btn => {
      btn.addEventListener('click', () => trackBus(btn.dataset.plate));
    });
  });
}

function trackBus(plate) {
  showView('view-passenger');
  const card = document.getElementById('pass-data-card');
  const busRef = db.ref('van/active_buses/' + plate);
  busRef.on('value', snap => {
    const bus = snap.val();
    if (!bus) { card.innerHTML = '車輛已離線'; return; }
    card.innerHTML = `
      <div style="font-size:24px; font-weight:bold; color:#ffcc00;">🚐 ${plate}</div>
      <div style="font-size:28px; font-weight:700; color:#ffcc00;">${bus.currentStation || '未知'}</div>
      <div>下一站：${bus.nextStation || '無'}</div>
      <div>👥 ${bus.passengerCount || 0}人</div>
    `;
  });
}

document.getElementById('btn-back-list').addEventListener('click', () => {
  if (busListRef) busListRef.off();
  showView('view-passenger-list');
  loadBusList();
});
document.getElementById('btn-back-track').addEventListener('click', () => {
  showView('view-passenger-list');
  loadBusList();
});

// ============================================================
//  司機功能（簡化）
// ============================================================
let gpsInterval = null;

function initDriverPanel() {
  if (!driverData.plate) {
    const plate = prompt('請輸入車牌號碼 (例如：AB1234)');
    if (plate) {
      driverData.plate = plate.toUpperCase();
    } else {
      showToast('必須輸入車牌');
      showView('view-lobby');
      return;
    }
  }
  updateDriverUI();
  // 監聽車輛數據
  const busRef = db.ref('van/active_buses/' + driverData.plate);
  busRef.on('value', snap => {
    const data = snap.val();
    if (data) {
      driverData.stationIndex = data.stationIndex || 0;
      driverData.passengerCount = data.passengerCount || 0;
      driverData.isActive = data.isActive || false;
      updateDriverUI();
    }
  });
  if (driverData.isActive) {
    document.getElementById('start-gps').style.display = 'none';
    document.getElementById('stop-gps').style.display = 'block';
  } else {
    document.getElementById('start-gps').style.display = 'block';
    document.getElementById('stop-gps').style.display = 'none';
  }
}

function updateDriverUI() {
  const route = BUSY;
  const idx = driverData.stationIndex || 0;
  const station = route[idx] || '未知';
  const nextIdx = idx + 1 < route.length ? idx + 1 : 0;
  document.getElementById('d-info').textContent = `🚐 ${driverData.plate || '未設定'} · 手機: ${currentUser.phone || '未登入'}`;
  document.getElementById('d-station').textContent = station;
  document.getElementById('d-target').textContent = '下一站：' + route[nextIdx];
  document.getElementById('d-pass-count').textContent = driverData.passengerCount;
}

document.getElementById('btn-add-pass').addEventListener('click', () => {
  if (!driverData.isActive) { showToast('請先開始當值'); return; }
  driverData.passengerCount++;
  updateDriverAndDB();
});
document.getElementById('btn-sub-pass').addEventListener('click', () => {
  if (driverData.passengerCount > 0) driverData.passengerCount--;
  updateDriverAndDB();
});
document.getElementById('btn-prev').addEventListener('click', () => {
  if (!driverData.isActive) { showToast('請先開始當值'); return; }
  if (driverData.stationIndex > 0) driverData.stationIndex--;
  updateDriverAndDB();
});
document.getElementById('btn-next').addEventListener('click', () => {
  if (!driverData.isActive) { showToast('請先開始當值'); return; }
  if (driverData.stationIndex < BUSY.length - 1) driverData.stationIndex++;
  else driverData.stationIndex = 0;
  updateDriverAndDB();
});

document.getElementById('start-gps').addEventListener('click', startDuty);
document.getElementById('stop-gps').addEventListener('click', stopDuty);

function startDuty() {
  if (!driverData.plate) { showToast('請先設定車牌'); return; }
  driverData.isActive = true;
  updateDriverAndDB();
  if (gpsInterval) clearInterval(gpsInterval);
  gpsInterval = setInterval(() => {
    if (driverData.isActive) {
      if (driverData.stationIndex < BUSY.length - 1) driverData.stationIndex++;
      else driverData.stationIndex = 0;
      updateDriverAndDB();
    }
  }, 15000);
  document.getElementById('start-gps').style.display = 'none';
  document.getElementById('stop-gps').style.display = 'block';
  showToast('已開始當值');
}

function stopDuty() {
  driverData.isActive = false;
  if (gpsInterval) { clearInterval(gpsInterval); gpsInterval = null; }
  updateDriverAndDB();
  document.getElementById('start-gps').style.display = 'block';
  document.getElementById('stop-gps').style.display = 'none';
  showToast('已停止當值');
}

function updateDriverAndDB() {
  const station = BUSY[driverData.stationIndex] || '未知';
  const nextIdx = driverData.stationIndex + 1 < BUSY.length ? driverData.stationIndex + 1 : 0;
  const data = {
    plate: driverData.plate,
    stationIndex: driverData.stationIndex,
    currentStation: station,
    nextStation: BUSY[nextIdx] || '終點',
    passengerCount: driverData.passengerCount,
    isActive: driverData.isActive,
    lastUpdate: Date.now()
  };
  if (driverData.plate) {
    db.ref('van/active_buses/' + driverData.plate).update(data);
  }
  updateDriverUI();
}

function loadAdminPanel() {
  const list = document.getElementById('admin-vehicle-list');
  const status = document.getElementById('admin-status');
  status.textContent = '🔄 載入中...';

  db.ref('van/active_buses').on('value', snap => {
    const data = snap.val() || {};
    let html = '';
    let count = 0;
    for (const plate in data) {
      const bus = data[plate];
      if (Date.now() - bus.lastUpdate < 60000) {
        count++;
        html += `<div class="card" style="padding:12px; margin-bottom:8px;">
          <strong style="color:#ffcc00;">${plate}</strong>
          <div>${bus.currentStation || '未知'} · 👥 ${bus.passengerCount || 0}人</div>
          <div style="font-size:12px; color:#888;">${bus.isActive ? '🟢 當值中' : '🔴 離線'}</div>
        </div>`;
      }
    }
    list.innerHTML = html || '暫無在線車輛';
    status.textContent = '🚐 在線車輛：' + count;
  });
}
