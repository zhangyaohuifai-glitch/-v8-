    const getMime = () => ['audio/webm','audio/mp4'].find(m=>MediaRecorder.isTypeSupported(m))||'';
    const startRec = (targetName, getRefFn, timerId) => {
        if (state.recorder?.state === 'recording') return;
        navigator.mediaDevices.getUserMedia({audio:true}).then(stream => {
            const mime = getMime();
            state.recorder = new MediaRecorder(stream, mime?{mimeType:mime}:{});
            state.audioChunks = [];
            state.recorder.ondataavailable = e => { if(e.data.size) state.audioChunks.push(e.data); };
            state.recorder.onstop = () => {
                if (!state.audioChunks.length) return;
                const blob = new Blob(state.audioChunks, {type: state.recorder.mimeType||'audio/webm'});
                const reader = new FileReader();
                reader.onloadend = () => {
                    const b64 = reader.result.split(',')[1];
                    const ref = getRefFn();
                    if(ref) ref.push({from: targetName, type:'audio', audioData:b64, ts:Date.now()});
                };
                reader.readAsDataURL(blob);
                stream.getTracks().forEach(t=>t.stop());
            };
            state.recorder.start();
            if (navigator.vibrate) navigator.vibrate(50);
            let sec = 0;
            const tEl = document.getElementById(timerId);
            if(tEl) tEl.textContent = '0s';
            state.recordTimer = setInterval(()=>{
                sec++;
                if(tEl) tEl.textContent = sec+'s';
                if(sec>=30) stopRec(timerId);
            }, 1000);
        }).catch(()=> toast('無法錄音'));
    };
    const stopRec = (timerId) => {
        if (state.recorder?.state === 'recording') state.recorder.stop();
        clearInterval(state.recordTimer);
        const tEl = document.getElementById(timerId);
        if(tEl) tEl.textContent = '0s';
    };
    const setupRecBtn = (btnId, targetName, getRefFn, timerId) => {
        const btn = document.getElementById(btnId);
        if(!btn) return;
        const newBtn = btn.cloneNode(true);
        btn.parentNode.replaceChild(newBtn, btn);
        newBtn.addEventListener('pointerdown', e => {
            e.preventDefault();
            newBtn.classList.add('recording');
            startRec(targetName, getRefFn, timerId);
        });
        newBtn.addEventListener('pointerup', () => { newBtn.classList.remove('recording'); stopRec(timerId); });
        newBtn.addEventListener('pointerleave', () => { if (state.recorder?.state==='recording'){ newBtn.classList.remove('recording'); stopRec(timerId); } });
        newBtn.addEventListener('pointercancel', () => { if (state.recorder?.state==='recording'){ newBtn.classList.remove('recording'); stopRec(timerId); } });

    function startGps() {
        if (!navigator.geolocation) return;
        if (state.driver.gpsId) navigator.geolocation.clearWatch(state.driver.gpsId);
        if (state.driver.gpsPollId) clearInterval(state.driver.gpsPollId);
        state.driver.gpsId = navigator.geolocation.watchPosition(pos => {
            let coords = state.driver.mode === 'busy' ? [...COORDS_BUSY] : [...COORDS_NORMAL];
            if ((state.driver.mode === 'busy' && state.driver.dirBusy) || (state.driver.mode === 'normal' && state.driver.dirNormal)) coords.reverse();
            const list = getStations();
            let bestIdx = -1, bestDist = Infinity;
            for (let i = state.driver.idx; i < list.length; i++) {
                if(!coords[i]) continue;
                const d = Math.hypot(pos.coords.latitude - coords[i].lat, pos.coords.longitude - coords[i].lng) * 111000;
                if (d < 100 && d < bestDist) { bestIdx = i; bestDist = d; }
            }
            if (bestIdx >= state.driver.idx) {
                state.driver.idx = bestIdx;
                const cur = cleanStation(list[bestIdx]), nxt = bestIdx+1<list.length ? cleanStation(list[bestIdx+1]) : null;
                speak(`即將到達：${cur}`, ()=>{ if(nxt) setTimeout(()=>speak(`下一站：${nxt}`),2000); });
                refreshDriverUI();
            }
        }, ()=>{}, { enableHighAccuracy: true });
        state.driver.gpsPollId = setInterval(() => navigator.geolocation.getCurrentPosition(()=>{}, ()=>{}), 8000);
    }
    function stopGps() {
        if (state.driver.gpsId) { navigator.geolocation.clearWatch(state.driver.gpsId); state.driver.gpsId = null; }
        if (state.driver.gpsPollId) { clearInterval(state.driver.gpsPollId); state.driver.gpsPollId = null; }
        if (state.driver.phone) activeRef.child(state.driver.phone).remove();
    }

            qrBox.appendChild(closeBtn);
            if(state.qrInstance) state.qrInstance.clear();
            state.qrInstance = new QRCode(qrBox, { text: window.location.href, width: 180, height: 180 });
        };

        let clicks=0;
        document.getElementById('dev-tag').onclick = async ()=>{
            clicks++; if(clicks>=5){ clicks=0;
                const input=prompt('管理員密碼：'); if(!input) return;
                const snap=await adminPasswordRef.once('value');
                if(input===snap.val()){
                    showView('view-admin');
                    activeRef.on('value', snap=>{
                        const data=snap.val()||{};
                        document.getElementById('admin-bus-list').innerHTML = Object.entries(data).filter(([k,v])=>v?.plate).map(([p,b])=>`<div class="card"><b>${b.plate}</b><br>${cleanStation(b.rawStationName)}<br><button class="btn btn-red" onclick="if(confirm('確定強制下線？')) firebase.database().ref('van/active_buses/${p}').remove()">強制下線</button></div>`).join('')||'無';
                    });
                } else toast('密碼錯誤');
            }
        };
        document.getElementById('btn-publish-announce').onclick = ()=>{ const t=document.getElementById('announce-input').value.trim(); if(t) announceRef.child('text').set(t); };
        document.getElementById('btn-clear-announce').onclick = ()=> announceRef.child('text').remove();
        document.getElementById('btn-admin-back').onclick = ()=> showView('view-lobby');

        let adminRec=null;
        document.getElementById('btn-admin-voice-record').addEventListener('pointerdown', async ()=>{
            if(adminRec) return;
            try {
                const stream=await navigator.mediaDevices.getUserMedia({audio:true});
                adminRec = new MediaRecorder(stream);
                const chunks=[];
                adminRec.ondataavailable = e => chunks.push(e.data);
                adminRec.onstop = ()=>{
                    const blob = new Blob(chunks, {type:'audio/webm'});
                    const reader = new FileReader();
                    reader.onloadend = ()=> adminVoiceRef.push({audioData:reader.result.split(',')[1], ts:Date.now()});
                    reader.readAsDataURL(blob);
                    stream.getTracks().forEach(t=>t.stop());
                    adminRec=null;
                };
                adminRec.start();
            } catch(e){}
        });
        document.addEventListener('pointerup', ()=>{ if(adminRec && adminRec.state==='recording') { adminRec.stop(); } });

        document.addEventListener('click', e => {
            if(e.target && e.target.classList.contains('play-audio-btn')) {
                const b64 = e.target.getAttribute('data-audio');
                if(b64) new Audio('data:audio/webm;base64,'+b64).play().catch(()=>{});
            }
        });

        window.addEventListener('beforeunload', () => {
            stopGps();
            if (state.recorder?.state === 'recording') state.recorder.stop();
            if (speechSynthesis.speaking) speechSynthesis.cancel();
        });
    });
})();
</script>
</body>
</html>
